
# 1. Stable Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-frontend
  labels:
    app: booking-frontend
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: booking-frontend
  template:
    metadata:
      labels:
        app: booking-frontend
        version: stable
    spec:
      containers:
        - name: booking-frontend
          image: ajaydhadi95/booking_frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

---
# 2. Stable Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: booking-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: booking-frontend
    version: stable
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---
# 3. Canary Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-frontend-canary
  labels:
    app: booking-frontend
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-frontend
      version: canary
  template:
    metadata:
      labels:
        app: booking-frontend
        version: canary
    spec:
      containers:
        - name: booking-frontend
          image: ajaydhadi95/booking_frontend:canary-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

---
# 4. Canary Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: booking-frontend-canary-service
spec:
  type: ClusterIP
  selector:
    app: booking-frontend
    version: canary
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
