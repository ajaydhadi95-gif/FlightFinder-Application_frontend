apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: booking-frontend
  template:
    metadata:
      labels:
        app: booking-frontend
    spec:
      containers:
        - name: booking-frontend
          image: ajaydhadi95/booking_frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: booking-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: booking-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP